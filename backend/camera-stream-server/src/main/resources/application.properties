spring.application.name=esp32-camera-stream-server

server.address=0.0.0.0
server.port=${SERVER_PORT:8090}
server.tomcat.keep-alive-timeout=1s
server.tomcat.max-keep-alive-requests=1
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b "%{User-Agent}i" "%{X-Stream-Token}i"

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

stream.ingest-token=${STREAM_INGEST_TOKEN:change-me}
stream.viewer-token=${STREAM_VIEWER_TOKEN:change-me}
stream.control-token=${STREAM_CONTROL_TOKEN:${STREAM_VIEWER_TOKEN:change-me}}
stream.max-frame-bytes=${STREAM_MAX_FRAME_BYTES:2097152}
stream.camera-id-pattern=${STREAM_CAMERA_ID_PATTERN:[A-Za-z0-9_-]{1,64}}
stream.mjpeg-wait-timeout-ms=${STREAM_MJPEG_WAIT_TIMEOUT_MS:5000}
stream.ffmpeg-path=${STREAM_FFMPEG_PATH:ffmpeg}
stream.hls-auto-start=${STREAM_HLS_AUTO_START:true}
stream.hls-root-dir=${STREAM_HLS_ROOT_DIR:${java.io.tmpdir}/esp32-camera-hls}
stream.hls-fps=${STREAM_HLS_FPS:10}
stream.hls-segment-seconds=${STREAM_HLS_SEGMENT_SECONDS:1}
stream.hls-list-size=${STREAM_HLS_LIST_SIZE:5}
stream.hls-width=${STREAM_HLS_WIDTH:640}
stream.hls-video-bitrate=${STREAM_HLS_VIDEO_BITRATE:650k}
stream.hls-maxrate=${STREAM_HLS_MAXRATE:850k}
stream.hls-bufsize=${STREAM_HLS_BUFSIZE:1300k}
stream.hls-startup-timeout-ms=${STREAM_HLS_STARTUP_TIMEOUT_MS:8000}
stream.hls-inactive-timeout-ms=${STREAM_HLS_INACTIVE_TIMEOUT_MS:30000}
